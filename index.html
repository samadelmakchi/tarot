<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="فال‌بین؛ فال‌های تاروت — تک‌کارتی، سه‌کارتی، صلیب، بله/خیر و چیدمان‌های کامل، بدون نیاز به اینترنت." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="./favicon.ico" />
  <link rel="apple-touch-icon" href="./logo.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>فال‌بین | فال‌های تاروت آنلاین</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">پرش به محتوا</a>
  <header class="topbar">
    <button class="home-btn" id="homeBtn" aria-label="بازگشت به خانه" title="خانه">
      <img src="./logo.png" alt="فال‌بین" width="70" height="26" />
    </button>
    <button class="theme-toggle" id="themeToggle" aria-label="تغییر تم روشن/تاریک" title="تغییر تم">
      <span class="theme-ico" aria-hidden="true"></span>
    </button>
  </header>

  <main id="main" class="main" tabindex="-1"></main>

  <button class="fab" id="installBtn" hidden>⬇ نصب برنامه</button>

  <script type="module" src="js/app.js"></script>
</body>
</html>
